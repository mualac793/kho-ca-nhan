<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kho cá nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@600;800&display=swap">
<style>
:root{--bg:#edf3ee;--sf:#f8fbf7;--ink:#13261c;--mu:#52685b;--ln:#c9d9cd;--ac:#1b7a4a;--onac:#fff;--acs:#d9eee0;--jd:#0f766e;--mk:#ffe08a;--mkt:#13261c;--side:#0f3a2b;--sidet:#e6f3ea;--sidem:#98c2ab;--code:#e4eee6;color-scheme:light;
--hd:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;--bd:"Newsreader","Noto Serif",Georgia,serif;--mo:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--hz:"Noto Serif SC","Songti SC","SimSun",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1812;--sf:#11231a;--ink:#e0ede5;--mu:#8cae99;--ln:#23402f;--ac:#5fd18f;--onac:#05200f;--acs:#143023;--jd:#4fd1c5;--mk:#6a5a14;--mkt:#fff3c4;--side:#06130d;--sidet:#e0efe6;--sidem:#7bad92;--code:#0d1f16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1812;--sf:#11231a;--ink:#e0ede5;--mu:#8cae99;--ln:#23402f;--ac:#5fd18f;--onac:#05200f;--acs:#143023;--jd:#4fd1c5;--mk:#6a5a14;--mkt:#fff3c4;--side:#06130d;--sidet:#e0efe6;--sidem:#7bad92;--code:#0d1f16;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 var(--bd);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sidet);position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 18px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 16px}
.brand h2{font:700 17px/1.15 var(--hd);margin:0}.brand p{margin:2px 0 0;font:13px/1.3 var(--hd);color:var(--sidem)}
.grp{font:500 13px var(--hd);color:var(--sidem);padding:14px 8px 4px}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:7px 8px;cursor:pointer;color:var(--sidet)}
.it:hover{background:rgba(255,255,255,.07)}
.it.on{background:var(--sf);color:var(--ink)}
.it b{display:block;font:600 14.5px/1.25 var(--hd)}.it small{display:block;font:12.5px/1.2 var(--hd);color:var(--sidem)}.it.on small{color:var(--mu)}
.cell{position:relative;flex:none;display:grid;place-items:center;font-family:var(--hz);font-weight:800;border:1.5px solid currentColor;color:var(--c,currentColor)}
.cell::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.38;
background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px) center/100% 1px no-repeat,repeating-linear-gradient(0deg,currentColor 0 4px,transparent 4px 8px) center/1px 100% no-repeat}
.cell.mi::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;
background:linear-gradient(to bottom right,transparent calc(50% - .6px),currentColor,transparent calc(50% + .6px)),linear-gradient(to top right,transparent calc(50% - .6px),currentColor,transparent calc(50% + .6px))}
.cell.sm{width:34px;height:34px;font-size:18px;border-radius:5px}
.side .cell{--c:var(--sidet)}.it.on .cell{--c:var(--ac)}
.cell.lg{width:96px;height:96px;font-size:58px;border-radius:8px;--c:var(--ac);background:var(--sf)}
.fd{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 8px;cursor:pointer;color:var(--sidet);font:700 14px var(--hd)}
.fd:hover{background:rgba(255,255,255,.07)}
.cv{display:inline-block;width:14px;color:var(--sidem);font-size:12px;transition:transform .15s}.fd[aria-expanded="false"] .cv{transform:rotate(-90deg)}
.ch{margin:0 0 2px 11px;padding-left:4px;border-left:1px solid rgba(255,255,255,.16)}
.ch .fd{font-weight:600;color:var(--sidem)}
.crumb{font:13px/1.2 var(--hd);color:var(--mu);margin:0 0 6px}
.priv{margin-top:auto;padding:16px 8px 0;font:12.5px/1.45 var(--hd);color:var(--sidem)}
main{min-width:0;padding:34px clamp(18px,4vw,56px) 80px}
.top{max-width:1120px;margin:0 auto}
.head{display:flex;gap:22px;align-items:center;margin-bottom:22px}
.head h1{font:700 clamp(26px,3.6vw,40px)/1.1 var(--hd);margin:0 0 10px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:13px/1 var(--hd);border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:6px 11px;color:var(--mu)}
.chip.ai{background:var(--acs);border-color:transparent;color:var(--ac);font-weight:600}
.tools{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;background:linear-gradient(var(--bg) 82%,transparent);margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:9px;overflow:hidden;background:var(--sf)}
.seg button{border:0;background:none;padding:7px 13px;font:600 13.5px var(--hd);cursor:pointer;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--onac)}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--onac);border-radius:9px;padding:7px 15px;font:600 13.5px var(--hd);cursor:pointer}
.btn.ok{background:var(--jd);border-color:var(--jd);color:#fff}
.ghost{background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:9px;padding:7px 12px;font:600 13.5px var(--hd);cursor:pointer}
.srch{display:flex;align-items:center;gap:8px;flex:1 1 200px;max-width:340px;border:1px solid var(--ln);background:var(--sf);border-radius:9px;padding:0 10px}
.srch input{border:0;background:none;outline:0;padding:7px 0;width:100%;font:14px var(--hd)}
.srch span{font:12.5px var(--hd);color:var(--mu);white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 228px;gap:44px;align-items:start}
article{min-width:0;max-width:78ch}
article h1,article h2,article h3,article h4{font-family:var(--hd);line-height:1.2;margin:2em 0 .55em;position:relative;letter-spacing:-.005em}
article h1{font-size:28px;margin-top:.3em}article h2{font-size:23px;padding-top:.7em;border-top:1px solid var(--ln)}article h3{font-size:18.5px}article h4{font-size:16.5px}
.cs{opacity:0;margin-left:8px;border:1px solid var(--ln);background:var(--sf);border-radius:6px;font:12px var(--hd);padding:1px 7px;cursor:pointer;color:var(--mu);vertical-align:middle}
h2:hover .cs,h3:hover .cs,h4:hover .cs,h1:hover .cs,.cs:focus-visible{opacity:1}
article p{margin:.55em 0}
.li{display:flex;gap:10px;margin:.4em 0;padding-left:calc(var(--lv)*22px)}
.mk{flex:none;min-width:1.5em;color:var(--ac);font:600 14px/1.95 var(--hd)}
b{font-weight:600}
code{font:500 .84em var(--mo);background:var(--code);border:1px solid var(--ln);border-radius:5px;padding:.08em .38em;word-break:break-word}
.han{font-family:var(--hz);font-weight:600;font-size:.96em}
blockquote{margin:.9em 0;padding:.2em 1em;border-left:3px solid var(--jd);color:var(--mu)}
hr{border:0;border-top:1px solid var(--ln);margin:2em 0}
.tw{overflow-x:auto;margin:1em 0;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--ln)}
th{font:600 13.5px var(--hd);background:var(--acs);color:var(--ac)}tr:last-child td{border-bottom:0}
pre.cb,pre.raw{margin:1em 0;padding:14px 16px;background:var(--code);border:1px solid var(--ln);border-radius:10px;font:13.5px/1.6 var(--mo);white-space:pre-wrap;word-break:break-word;overflow:auto}
pre.raw{margin:0;max-width:none}
.cbw{position:relative}.cc{position:absolute;top:8px;right:8px;z-index:1;border:1px solid var(--ln);background:var(--sf);color:var(--mu);border-radius:7px;font:600 12px var(--hd);padding:3px 9px;cursor:pointer}.cc:hover{color:var(--ink)}.cc.ok{background:var(--jd);border-color:var(--jd);color:#fff}
pre.cb{max-height:560px}
[hidden]{display:none!important}
#ed{width:100%;min-height:70vh;font:13.5px/1.6 var(--mo);background:var(--code);color:var(--ink);border:1px solid var(--ac);border-radius:10px;padding:14px;resize:vertical;tab-size:2}
.msg{font:13px var(--hd);color:var(--mu)}
.chip.ed{background:var(--jd);border-color:transparent;color:#fff;font-weight:600}.chip.st{border-color:var(--jd);color:var(--jd)}
mark{background:var(--mk);color:var(--mkt);border-radius:3px;padding:0 1px}mark.cur{outline:2px solid var(--ac)}
.toc{position:sticky;top:64px;max-height:calc(100vh - 90px);overflow:auto;font:13.5px/1.4 var(--hd)}
.toc p{margin:0 0 8px;font-weight:700;color:var(--mu)}
.toc a{display:block;padding:5px 0 5px 12px;border-left:2px solid var(--ln);color:var(--mu);text-decoration:none;cursor:pointer}
.toc a.s3{padding-left:24px;font-size:12.5px}.toc a.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.toc a:hover{color:var(--ink)}
@media (max-width:1180px){.cols{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;gap:6px;align-items:center}
 .brand,.fd,.priv{display:none}.fdw,.ch{display:contents}.ch[hidden]{display:contents!important}.it{width:auto;flex:none;padding:6px 10px 6px 6px}.it small{display:none}
 .chip.f{display:none}.chip.f{display:none}.head{gap:14px}.cell.lg{width:68px;height:68px;font-size:40px}main{padding-top:20px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<div class="app">
<aside class="side" id="side"></aside>
<main><div class="top">
<div class="head"><div class="cell lg mi" id="hg"></div><div><div class="crumb" id="hb"></div><h1 id="ht"></h1><div class="chips" id="hc"></div></div></div>
<div class="tools">
<div class="seg" id="seg"><button data-m="doc" class="on">Đọc</button><button data-m="raw">Văn bản gốc</button></div>
<button class="btn" id="cp">Sao chép toàn bộ</button>
<button class="ghost" id="sb" hidden>Sửa</button>
<span id="eb" hidden><button class="btn" id="es">Lưu</button> <button class="ghost" id="ec">Hủy</button> <button class="ghost" id="er">Khôi phục bản của Claude</button> <span class="msg" id="em"></span></span>
<label class="srch"><input id="q" type="search" placeholder="Tìm trong mục này (phím /)" aria-label="Tìm trong mục này"><span id="qc"></span></label>
<button class="ghost" id="th" title="Đổi giao diện sáng hoặc tối">Giao diện</button>
</div>
<div class="cols"><article id="doc"></article><nav class="toc" id="toc" aria-label="Mục lục"></nav></div>
</div></main></div>
<script>
let D = [];
let curId = null;
let mode = "doc";
let editing = false;

const $ = id => document.getElementById(id);
const GH_KEY = "kho_ca_nhan_gh";

function getGH() {
  try { return JSON.parse(localStorage.getItem(GH_KEY) || "null"); } catch { return null; }
}
function saveGH(cfg) {
  localStorage.setItem(GH_KEY, JSON.stringify(cfg));
}
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function fromBase64(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

// Thêm nút Cài đặt GitHub cạnh nút Giao diện
const ghBtn = document.createElement("button");
ghBtn.className = "ghost";
ghBtn.textContent = "GitHub";
ghBtn.title = "Cài đặt đồng bộ GitHub";
ghBtn.onclick = openGHConfig;
$("th").after(ghBtn);

function openGHConfig() {
  const cfg = getGH() || { repo: "", token: "" };
  const repo = prompt("Nhập tên kho GitHub (dạng ten-tai-khoan/kho-ca-nhan):", cfg.repo);
  if (repo === null) return;
  const token = prompt("Nhập GitHub Personal Access Token (github_pat_...):", cfg.token);
  if (token === null) return;
  saveGH({ repo: repo.trim(), token: token.trim() });
  alert("Đã lưu cấu hình GitHub! Bạn có thể bấm Sửa -> Lưu ngay trên web.");
  loadData();
}

async function loadData() {
  const cfg = getGH();
  if (cfg && cfg.repo && cfg.token) {
    try {
      const res = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/data.json?t=${Date.now()}`, {
        headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json" },
        cache: "no-store"
      });
      if (res.ok) {
        const j = await res.json();
        D = JSON.parse(fromBase64(j.content));
        initUI();
        return;
      }
    } catch (e) { console.warn("Lỗi tải từ GitHub API, chuyển sang data.json:", e); }
  }
  const res = await fetch(`./data.json?t=${Date.now()}`, { cache: "no-store" });
  D = await res.json();
  initUI();
}

function initUI() {
  renderSide();
  const hashId = location.hash.slice(1);
  const first = D.find(x => x.id === hashId) || D.find(x => x.id === curId) || D[0];
  if (first) selectItem(first.id);
}

function renderSide() {
  const side = $("side");
  side.innerHTML = `<div class="brand"><div class="cell sm mi">学</div><div><h2>Kho cá nhân</h2><p>ngoại ngữ, YouTube</p></div></div>`;
  const tree = { children: {}, items: [] };
  D.forEach(item => {
    let node = tree;
    (item.p || []).forEach(folder => {
      if (!node.children[folder]) node.children[folder] = { children: {}, items: [] };
      node = node.children[folder];
    });
    node.items.push(item);
  });

  function buildNode(node, container) {
    node.items.forEach(it => {
      const btn = document.createElement("button");
      btn.className = "it" + (it.id === curId ? " on" : "");
      btn.dataset.id = it.id;
      btn.innerHTML = `<div class="cell sm">${it.glyph || "文"}</div><div><b>${esc(it.ten)}</b>${it.ai || it.g ? `<small>${esc(it.ai || it.g)}</small>` : ""}</div>`;
      btn.onclick = () => selectItem(it.id);
      container.appendChild(btn);
    });
    Object.keys(node.children).forEach(name => {
      const wrap = document.createElement("div");
      wrap.className = "fdw";
      const fd = document.createElement("button");
      fd.className = "fd";
      fd.setAttribute("aria-expanded", "true");
      fd.innerHTML = `<span class="cv">▾</span><span>${esc(name)}</span>`;
      const ch = document.createElement("div");
      ch.className = "ch";
      fd.onclick = () => {
        const exp = fd.getAttribute("aria-expanded") === "true";
        fd.setAttribute("aria-expanded", String(!exp));
        ch.hidden = exp;
      };
      buildNode(node.children[name], ch);
      wrap.append(fd, ch);
      container.appendChild(wrap);
    });
  }
  buildNode(tree, side);
}

function selectItem(id) {
  curId = id;
  editing = false;
  location.hash = id;
  document.querySelectorAll(".it").forEach(el => el.classList.toggle("on", el.dataset.id === id));
  const it = D.find(x => x.id === id);
  if (!it) return;
  $("hg").textContent = it.glyph || "文";
  $("hb").textContent = (it.p || []).join(" / ");
  $("ht").textContent = it.ten;
  const chips = [];
  if (it.ai) chips.push(`<span class="chip ai">${esc(it.ai)}</span>`);
  if (it.file) chips.push(`<span class="chip f">${esc(it.file)}</span>`);
  if (it.ngay) chips.push(`<span class="chip">Cập nhật ${esc(it.ngay)}</span>`);
  $("hc").innerHTML = chips.join("");
  $("sb").hidden = false;
  $("eb").hidden = true;
  $("em").textContent = "";
  $("q").value = "";
  $("qc").textContent = "";
  renderContent(it);
}

function esc(s) {
  return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function inlineMd(s) {
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  out = out.replace(/&lt;br&gt;/gi, "<br>");
  return out;
}

function renderMd(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "", i = 0, toc = [];
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith("```")) {
      let code = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) { code.push(lines[i]); i++; }
      i++;
      html += `<div class="cbw"><button class="cc">Chép mã</button><pre class="cb">${esc(code.join("\n"))}</pre></div>`;
      continue;
    }
    const hm = line.match(/^(#{1,4})\s+(.*)$/);
    if (hm) {
      const lv = hm[1].length, txt = hm[2], hid = "h-" + toc.length;
      if (lv === 2 || lv === 3) toc.push({ lv, txt, hid });
      html += `<h${lv} id="${hid}">${inlineMd(txt)}</h${lv}>`;
      i++; continue;
    }
    if (line.trim() === "---") { html += "<hr>"; i++; continue; }
    if (line.startsWith("|") && i + 1 < lines.length && lines[i + 1].trim().startsWith("|---")) {
      const head = line.split("|").slice(1, -1).map(c => `<th>${inlineMd(c.trim())}</th>`).join("");
      i += 2;
      let rows = "";
      while (i < lines.length && lines[i].startsWith("|")) {
        const cols = lines[i].split("|").slice(1, -1).map(c => `<td>${inlineMd(c.trim())}</td>`).join("");
        rows += `<tr>${cols}</tr>`;
        i++;
      }
      html += `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
      continue;
    }
    const lm = line.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (lm) {
      const lv = Math.floor(lm[1].length / 2);
      html += `<div class="li" style="--lv:${lv}"><span class="mk">${lm[2] === "-" || lm[2] === "*" ? "•" : lm[2]}</span><div>${inlineMd(lm[3])}</div></div>`;
      i++; continue;
    }
    if (line.startsWith("> ")) {
      html += `<blockquote>${inlineMd(line.slice(2))}</blockquote>`;
      i++; continue;
    }
    if (line.trim() === "") { i++; continue; }
    html += `<p>${inlineMd(line)}</p>`;
    i++;
  }
  return { html, toc };
}

function renderContent(it) {
  const doc = $("doc"), tocEl = $("toc");
  if (editing) {
    doc.innerHTML = `<textarea id="ed"></textarea>`;
    $("ed").value = it.text || "";
    tocEl.innerHTML = "";
    return;
  }
  if (mode === "raw") {
    doc.innerHTML = `<pre class="raw">${esc(it.text)}</pre>`;
    tocEl.innerHTML = "";
    return;
  }
  const { html, toc } = renderMd(it.text || "");
  doc.innerHTML = html;
  doc.querySelectorAll(".cc").forEach(btn => {
    btn.onclick = () => {
      navigator.clipboard.writeText(btn.nextElementSibling.textContent);
      btn.textContent = "Đã chép"; btn.classList.add("ok");
      setTimeout(() => { btn.textContent = "Chép mã"; btn.classList.remove("ok"); }, 1500);
    };
  });
  tocEl.innerHTML = toc.length ? `<p>Mục lục</p>` + toc.map(t => `<a class="${t.lv === 3 ? "s3" : ""}" href="#${t.hid}">${esc(t.txt)}</a>`).join("") : "";
}

// Chuyển chế độ Đọc / Văn bản gốc
$("seg").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  mode = b.dataset.m;
  $("seg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  editing = false; $("sb").hidden = false; $("eb").hidden = true;
  renderContent(D.find(x => x.id === curId));
};

// Sao chép toàn bộ
$("cp").onclick = () => {
  const it = D.find(x => x.id === curId);
  if (!it) return;
  navigator.clipboard.writeText(it.text || "");
  $("cp").textContent = "Đã sao chép"; $("cp").classList.add("ok");
  setTimeout(() => { $("cp").textContent = "Sao chép toàn bộ"; $("cp").classList.remove("ok"); }, 1500);
};

// Sửa & Lưu thẳng lên GitHub
$("sb").onclick = () => {
  editing = true;
  $("sb").hidden = true;
  $("eb").hidden = false;
  $("er").hidden = true;
  renderContent(D.find(x => x.id === curId));
};
$("ec").onclick = () => {
  editing = false;
  $("sb").hidden = false;
  $("eb").hidden = true;
  renderContent(D.find(x => x.id === curId));
};
$("es").onclick = async () => {
  const cfg = getGH();
  if (!cfg || !cfg.repo || !cfg.token) {
    openGHConfig();
    return;
  }
  const it = D.find(x => x.id === curId);
  const newText = $("ed").value;
  $("em").textContent = "Đang lưu lên GitHub...";
  try {
    const url = `https://api.github.com/repos/${cfg.repo}/contents/data.json`;
    const getRes = await fetch(url, { headers: { Authorization: `Bearer ${cfg.token}` }, cache: "no-store" });
    if (!getRes.ok) throw new Error("Không đọc được data.json trên GitHub (kiểm tra lại tên repo và Token).");
    const fileInfo = await getRes.json();

    it.text = newText;
    it.ngay = new Date().toISOString().slice(0, 10);
    const updatedJson = JSON.stringify(D, null, 2);

    const putRes = await fetch(url, {
      method: "PUT",
      headers: { Authorization: `Bearer ${cfg.token}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        message: `Cập nhật ${it.ten}`,
        content: toBase64(updatedJson),
        sha: fileInfo.sha
      })
    });
    if (!putRes.ok) throw new Error("Lưu thất bại. Hãy kiểm tra quyền Read and write cho Contents của Token.");
    editing = false;
    $("sb").hidden = false;
    $("eb").hidden = true;
    $("em").textContent = "";
    selectItem(curId);
    alert("Đã lưu thành công lên GitHub!");
  } catch (err) {
    $("em").textContent = err.message;
  }
};

// Tìm kiếm trong mục (phím /)
$("q").oninput = () => {
  const q = $("q").value.trim().toLowerCase();
  const it = D.find(x => x.id === curId);
  if (!it || editing) return;
  renderContent(it);
  if (!q) { $("qc").textContent = ""; return; }
  let count = 0;
  const walk = node => {
    if (node.nodeType === 3) {
      const idx = node.nodeValue.toLowerCase().indexOf(q);
      if (idx >= 0) {
        count++;
        const span = document.createElement("span");
        const v = node.nodeValue;
        span.innerHTML = esc(v.slice(0, idx)) + `<mark>${esc(v.slice(idx, idx + q.length))}</mark>` + esc(v.slice(idx + q.length));
        node.replaceWith(span);
      }
    } else if (node.nodeType === 1 && !["SCRIPT", "STYLE", "BUTTON"].includes(node.tagName)) {
      [...node.childNodes].forEach(walk);
    }
  };
  walk($("doc"));
  $("qc").textContent = count ? `${count} kết quả` : "0";
};
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
    e.preventDefault(); $("q").focus();
  }
});

// Đổi giao diện sáng/tối
$("th").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("kho_theme", next);
};
const savedTheme = localStorage.getItem("kho_theme");
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

loadData();
</script></body></html>
